
services:
  django:
    build:
      context: ../..
      dockerfile: ./docker/nonprod/Dockerfile
      args:
        - USER=${USER}
    volumes:
      - ../..:/backend
      - ${HOME}/.ssh:/home/${USER}/.ssh
    ports:
      - 8002:8000
      - 8003:8001
    container_name: django_cies
    environment:
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_HOST=${POSTGRES_HOST}
      - POSTGRES_PORT=5432
    networks:
      - db
    command: /bin/sh -c "while sleep 1000; do :; done"

networks:
  db:
    name: non_prod_db_network
    external: true